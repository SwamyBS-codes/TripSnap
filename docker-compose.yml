services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-tripvault}
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data, ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro]
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:5173,*"
    ports: ['9000:9000','9001:9001']
    volumes: [miniodata:/data]
  minio-init:
    image: amazon/aws-cli:latest
    depends_on: [minio]
    entrypoint:
      - /bin/sh
      - -c
      - >
        export AWS_ACCESS_KEY_ID=minioadmin;
        export AWS_SECRET_ACCESS_KEY=minioadmin;
        export AWS_DEFAULT_REGION=us-east-1;
        until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do sleep 1; done;
        aws --endpoint-url http://minio:9000 s3 mb s3://tripvault-originals || true;
        aws --endpoint-url http://minio:9000 s3 mb s3://tripvault-processed || true;
        echo "MinIO buckets ready."
  kafka:
    image: apache/kafka:3.9.1
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  api:
    build: ./backend/api
    env_file: .env
    restart: on-failure
    ports: ['4000:4000']
    depends_on: [postgres, minio, minio-init, kafka]
  worker:
    build: ./backend/worker
    env_file: .env
    restart: on-failure
    depends_on: [postgres, minio, minio-init, kafka]
  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api
    ports: ['3000:80']
    depends_on: [api]
volumes:
  pgdata:
  miniodata: